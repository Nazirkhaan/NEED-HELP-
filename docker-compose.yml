services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sih26044-db
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
      POSTGRES_DB: sih26044
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih26044"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
